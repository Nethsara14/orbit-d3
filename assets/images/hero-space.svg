<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 650" role="img" aria-labelledby="title desc">
  <title id="title">Moon and orbital exploration illustration</title>
  <desc id="desc">A large illuminated Moon with orbital trails and a small satellite against a deep blue star field.</desc>
  <defs>
    <radialGradient id="moon" cx="31%" cy="26%" r="77%">
      <stop offset="0" stop-color="#f4f8ff"/><stop offset=".34" stop-color="#b1d0e9"/>
      <stop offset=".75" stop-color="#527ba5"/><stop offset="1" stop-color="#1b3763"/>
    </radialGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#477cff" stop-opacity=".35"/><stop offset=".7" stop-color="#2c82d0" stop-opacity=".08"/><stop offset="1" stop-color="#2746a6" stop-opacity="0"/></radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8edfff"/><stop offset=".55" stop-color="#6877ff"/><stop offset="1" stop-color="#92dafa"/></linearGradient>
    <linearGradient id="dish" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b7dbef"/><stop offset="1" stop-color="#47678d"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10"/></filter>
    <clipPath id="moonClip"><circle cx="357" cy="329" r="170"/></clipPath>
  </defs>
  <circle cx="350" cy="325" r="310" fill="url(#halo)"/>
  <g fill="#d9eeff" opacity=".8">
    <circle cx="110" cy="110" r="2"/><circle cx="590" cy="85" r="1.8"/><circle cx="625" cy="365" r="2"/><circle cx="98" cy="450" r="1.5"/><circle cx="513" cy="560" r="2.3"/><circle cx="247" cy="61" r="1.3"/><circle cx="132" cy="294" r="1.4"/><circle cx="644" cy="197" r="1.2"/><circle cx="565" cy="473" r="1.1"/>
  </g>
  <!-- Orbital trails extend around the planet instead of resembling official insignia. -->
  <ellipse cx="351" cy="330" rx="297" ry="206" transform="rotate(-30 351 330)" fill="none" stroke="url(#orbit)" stroke-width="2.2" opacity=".68"/>
  <ellipse cx="351" cy="330" rx="309" ry="220" transform="rotate(32 351 330)" fill="none" stroke="#7294ed" stroke-width="1.6" stroke-dasharray="7 10" opacity=".46"/>
  <circle cx="357" cy="329" r="183" fill="#77baff" opacity=".25" filter="url(#glow)"/>
  <circle cx="357" cy="329" r="170" fill="url(#moon)"/>
  <g clip-path="url(#moonClip)" opacity=".3">
    <circle cx="301" cy="252" r="31" fill="#4c799b"/><circle cx="301" cy="252" r="23" fill="#87afcc"/>
    <circle cx="432" cy="342" r="39" fill="#385c81"/><circle cx="432" cy="342" r="29" fill="#89a8ca"/>
    <circle cx="294" cy="403" r="23" fill="#3d628e"/><circle cx="294" cy="403" r="17" fill="#a0bdd2"/>
    <circle cx="399" cy="222" r="17" fill="#456a89"/><circle cx="399" cy="222" r="12" fill="#a6c7db"/>
    <circle cx="365" cy="440" r="12" fill="#345c80"/><circle cx="235" cy="335" r="12" fill="#537c9f"/><circle cx="456" cy="265" r="14" fill="#496c8a"/>
    <path d="M220 323c78 33 112-21 166-5s88-14 158 14v105H220z" fill="#6b92b2" opacity=".48"/>
    <path d="M200 205c54 30 86 6 114 24s99 5 119-8 40-2 106 9v-80H200z" fill="#e1f2ff" opacity=".25"/>
  </g>
  <!-- Small robotic equipment silhouette, meant as an original artistic accent. -->
  <g transform="translate(389 485) rotate(-8)">
    <ellipse cx="0" cy="24" rx="46" ry="11" fill="#152b50" opacity=".55"/>
    <path d="M-24 15h48l-10-18h-29z" fill="#172840" stroke="#bbd7f5" stroke-width="2"/>
    <path d="M-13 -3v-20l12-9 12 9v20" fill="none" stroke="#bed7ef" stroke-width="2"/>
    <rect x="-5" y="-25" width="11" height="15" fill="#91dcff"/>
    <path d="M-28 18l-17 14M29 18l18 14" stroke="#d5eafa" stroke-width="3"/>
  </g>
  <!-- Small satellite on the outer ring. -->
  <g transform="translate(552 172) rotate(-34)">
    <path d="M-15 0h-41v-28h41zM16 0h41v-28H16z" fill="#1d4e83" stroke="#88cfff" stroke-width="2"/>
    <path d="M-35-28v28M-15-28v28M36-28v28" stroke="#87cfff" stroke-width="1" opacity=".7"/>
    <rect x="-13" y="-30" width="27" height="32" rx="4" fill="url(#dish)" stroke="#edfaff" stroke-width="2"/>
    <path d="M0 -30v-18m-12-1h24" stroke="#d7f2ff" stroke-width="2"/>
    <circle cx="0" cy="-49" r="4" fill="#7ce3ff"/>
  </g>
  <circle cx="93" cy="378" r="6" fill="#9af4ff"/><circle cx="93" cy="378" r="15" fill="#9af4ff" opacity=".22"/>
  <circle cx="580" cy="509" r="4" fill="#d5b4ff"/>
</svg>
